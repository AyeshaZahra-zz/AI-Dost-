<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dost - Pakistan Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 700px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .header h1 {
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .lang-btn {
            padding: 8px 15px;
            border: 2px solid white;
            background: transparent;
            color: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .lang-btn.active {
            background: white;
            color: #1abc9c;
        }
        
        .voice-btn {
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .voice-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }
        
        .voice-btn.recording {
            background: #ff3333;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.5;
            font-size: 14px;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            align-self: flex-end;
            background: #1abc9c;
            color: white;
            border-bottom-right-radius: 0;
        }
        
        .bot-message {
            align-self: flex-start;
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 0;
        }
        
        .welcome {
            text-align: center;
            color: #999;
            padding: 20px;
            font-size: 13px;
        }
        
        .urdu-text {
            font-family: 'Segoe UI', Arial, sans-serif;
            direction: rtl;
            text-align: right;
        }
        
        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            background: white;
            flex-wrap: wrap;
        }
        
        .input-area input {
            flex: 1;
            min-width: 200px;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 25px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #1abc9c;
        }
        
        .input-area button {
            padding: 12px 25px;
            background: #1abc9c;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        .input-area button:hover {
            background: #16a085;
        }
        
        .clear-btn {
            background: #dc3545;
        }
        
        .clear-btn:hover {
            background: #c82333;
        }
        
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #1abc9c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🇵🇰 AI Dost</h1>
            <div class="controls">
                <button class="lang-btn active" onclick="setLanguage('english')">English</button>
                <button class="lang-btn" onclick="setLanguage('urdu')">اردو</button>
                <button class="voice-btn" onclick="startVoice()">🎤 Speak</button>
            </div>
        </div>
        
        <div class="chat-area" id="chat">
            <div class="welcome" id="welcome">
                <strong>🎉 Welcome to AI Dost!</strong><br>
                Ask about: NADRA, Healthcare, Education, Taxes, Pensions, BISP
            </div>
        </div>
        
        <div class="input-area">
            <input type="text" id="question" placeholder="Type or click 🎤 to speak..." autocomplete="off">
            <button onclick="askQuestion()">Send</button>
            <button class="clear-btn" onclick="clearChat()">Clear</button>
        </div>
    </div>

    <script>
        let history = [];
        let currentLanguage = "english";
        let recognition;
        
        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            
            recognition.onstart = () => {
                document.querySelector('.voice-btn').classList.add('recording');
            };
            
            recognition.onend = () => {
                document.querySelector('.voice-btn').classList.remove('recording');
            };
            
            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    transcript += event.results[i][0].transcript;
                }
                document.getElementById('question').value = transcript;
                askQuestion();
            };
            
            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
            };
        }
        
        function startVoice() {
            if (recognition) {
                recognition.lang = currentLanguage === 'urdu' ? 'ur-PK' : 'en-US';
                recognition.start();
            } else {
                alert('Speech Recognition not supported in this browser');
            }
        }
        
        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
        }
        
        async function askQuestion() {
            const q = document.getElementById("question").value;
            if (!q.trim()) return;
            
            history.push({role: "User", content: q});
            
            const chatDiv = document.getElementById("chat");
            chatDiv.innerHTML += '<div class="message user-message">' + escapeHtml(q) + '</div>';
            document.getElementById("question").value = "";
            
            const welcome = document.getElementById("welcome");
            if (welcome) welcome.remove();
            
            chatDiv.innerHTML += '<div class="message bot-message"><div class="loading"></div> Thinking...</div>';
            chatDiv.scrollTop = chatDiv.scrollHeight;
            
            try {
                const response = await fetch("http://127.0.0.1:8000/ask", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        text: q, 
                        language: currentLanguage,
                        history: history
                    })
                });
                
                const data = await response.json();
                const answer = data.response;
                
                history.push({role: "AI Dost", content: answer});
                
                chatDiv.removeChild(chatDiv.lastChild);
                
                const answerDiv = currentLanguage === 'urdu' ? 
                    '<div class="message bot-message urdu-text">' + escapeHtml(answer) + '</div>' :
                    '<div class="message bot-message">' + escapeHtml(answer) + '</div>';
                chatDiv.innerHTML += answerDiv;
                chatDiv.scrollTop = chatDiv.scrollHeight;
                
                // TTS (Text-to-Speech)
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(answer);
                    utterance.lang = currentLanguage === 'urdu' ? 'ur-PK' : 'en-US';
                    utterance.rate = 0.9;
                    speechSynthesis.speak(utterance);
                }
                
            } catch(e) {
                chatDiv.removeChild(chatDiv.lastChild);
                chatDiv.innerHTML += '<div class="message bot-message">Error: ' + e.message + '</div>';
            }
        }
        
        function clearChat() {
            history = [];
            document.getElementById("chat").innerHTML = '<div class="welcome" id="welcome"><strong>🎉 Welcome to AI Dost!</strong><br>Ask about: NADRA, Healthcare, Education, Taxes, Pensions, BISP</div>';
        }
        
        function escapeHtml(text) {
            const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        document.getElementById("question").addEventListener("keypress", function(e) {
            if (e.key === "Enter") askQuestion();
        });
    </script>
</body>
</html>
